<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console — Triangle Games</title>
  <link rel="stylesheet" href="/shared/reset.css">
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-card: #16213e;
      --bg-card-2: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --text-dim: #aaa;
      --border: #2a3050;
      --green: #2ecc71;
      --gold: #ffd700;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      padding: 1.5rem 1rem 3rem;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    .top {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .top a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.85rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      margin-right: auto;
    }

    .me { font-size: 0.85rem; color: var(--text-dim); }
    .me .name { color: var(--text); font-weight: 700; }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
    @media (min-width: 540px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-grid .full { grid-column: 1 / -1; }
    }

    .input-field {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card-2);
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
      font-family: inherit;
    }
    .input-field:focus { outline: none; border-color: var(--accent); }

    .checkbox-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.9rem; color: var(--text-dim);
      padding: 0.4rem 0;
    }
    .checkbox-row input { transform: scale(1.2); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.1rem;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, opacity 0.1s, background 0.1s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg-card-2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: #6b1f2f; color: #fff; border: 1px solid #8a2937; }
    .btn-success { background: #1d6d3a; color: #fff; border: 1px solid #2a8a4d; }
    .btn-small { padding: 0.4rem 0.75rem; font-size: 0.8rem; }

    .msg { font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
    .msg.error { color: var(--accent); }
    .msg.success { color: var(--green); }

    .user-list { list-style: none; padding: 0; margin: 0; }
    .user-row {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.6rem;
    }
    .user-row.disabled { opacity: 0.55; }
    .user-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
    }
    .user-name { font-weight: 700; font-size: 1rem; }
    .user-email { color: var(--text-dim); font-size: 0.85rem; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
    }
    .badge-admin { background: var(--accent); color: #fff; }
    .badge-disabled { background: #444; color: #ddd; }
    .badge-me { background: var(--gold); color: #1a1a2e; }

    .user-meta {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }

    .user-actions {
      display: flex; gap: 0.4rem; flex-wrap: wrap;
      margin-top: 0.65rem;
    }

    .pwd-form {
      display: none;
      gap: 0.4rem;
      margin-top: 0.55rem;
      flex-wrap: wrap;
    }
    .pwd-form.open { display: flex; }
    .pwd-form input {
      flex: 1;
      min-width: 180px;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }

    .empty { color: var(--text-dim); text-align: center; padding: 1rem; }

    .game-detail {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .game-detail.open { display: block; }

    .quiz-create-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .quiz-create-row .input-field { flex: 1; min-width: 200px; }

    .quiz-editor { display: none; }
    .quiz-editor.open { display: block; }
    #content.editor-open > .panel:not(.quiz-editor) { display: none; }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .editor-head .editor-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }
    .editor-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .editor-rename-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .editor-rename-row .input-field { flex: 1; min-width: 200px; }

    .editor-meta { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 0.75rem; }

    .editor-section {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.85rem;
    }
    .editor-section-head {
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .category-list { list-style: none; padding: 0; margin: 0 0 0.5rem; }
    .category-row {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.5rem;
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
      border: 1px solid var(--border);
    }
    .category-row .cat-name { flex: 1; font-weight: 600; }
    .category-row input.cat-name-input {
      flex: 1;
      background: var(--bg-card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.5rem;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      min-width: 2rem; min-height: 2rem;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px;
      cursor: pointer; font-size: 1rem; line-height: 1;
      font-family: inherit;
    }
    .icon-btn:disabled { opacity: 0.35; pointer-events: none; }

    .cat-empty { color: var(--text-dim); font-size: 0.85rem; padding: 0.2rem 0 0.5rem; }

    .question-list {
      list-style: none;
      padding: 0;
      margin: 0 0 0.5rem;
    }
    .question-group-head {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      margin: 0.4rem 0 0.3rem;
      padding-left: 0.1rem;
    }
    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
    }
    .question-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
    }
    .question-pos {
      background: var(--accent);
      color: #fff;
      width: 1.4rem; height: 1.4rem;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800;
      flex: 0 0 auto;
    }
    .question-type-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--bg-card-2);
      color: var(--text-dim);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }
    .question-prompt { font-size: 0.92rem; margin-bottom: 0.25rem; }
    .question-answers { font-size: 0.78rem; color: var(--text-dim); }
    .question-actions {
      display: flex; gap: 0.3rem; margin-top: 0.4rem; flex-wrap: wrap;
    }

    .q-form {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .q-form label {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 0.15rem;
    }
    .textarea-field {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.9rem;
      min-height: 3rem;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
    }
    .textarea-field:focus { outline: none; border-color: var(--accent); }

    .option-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.3rem;
    }
    .option-row .input-field { flex: 1; min-width: 0; padding: 0.45rem 0.65rem; }
    .option-row input[type=checkbox],
    .option-row input[type=radio] { transform: scale(1.15); }

    .q-form-buttons {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .game-detail h3 {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0.4rem 0 0.4rem;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .detail-table th, .detail-table td {
      text-align: left;
      padding: 0.35rem 0.4rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .detail-table th {
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .detail-table td.dim { color: var(--text-dim); }
    .detail-table td.num { text-align: right; }

    .detail-winner {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .detail-winner .dim { color: var(--text-dim); font-weight: 400; }

    .access-denied {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }
    .access-denied a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="top">
      <h1>Admin Console</h1>
      <div class="me" id="me"></div>
      <a href="/">&larr; Home</a>
    </div>

    <div id="loading" class="empty">Loading…</div>

    <div id="content" style="display:none">
      <div class="panel quiz-editor" id="quiz-editor">
        <div class="editor-head">
          <span class="editor-title" id="editor-title">Quiz</span>
          <button type="button" class="editor-back" id="editor-back">&larr; Back</button>
        </div>
        <div class="editor-meta" id="editor-meta"></div>

        <div class="editor-rename-row">
          <input class="input-field" id="editor-rename-input" placeholder="Rename quiz" maxlength="80">
          <button type="button" class="btn btn-secondary btn-small" id="editor-rename-btn">Save name</button>
        </div>
        <div id="editor-rename-msg" class="msg"></div>

        <div class="editor-section">
          <div class="editor-section-head">Categories</div>
          <ul class="category-list" id="category-list"></ul>
          <div class="quiz-create-row">
            <input class="input-field" id="new-category-name" placeholder="New category name" maxlength="60">
            <button type="button" class="btn btn-secondary btn-small" id="new-category-btn">+ Add</button>
          </div>
          <div id="category-msg" class="msg"></div>
        </div>

        <div class="editor-section">
          <div class="editor-section-head">Questions</div>
          <ul class="question-list" id="question-list"></ul>
        </div>

        <div class="editor-section">
          <div class="editor-section-head" id="q-form-head">Add Question</div>
          <div class="q-form">
            <label for="q-prompt">Prompt</label>
            <textarea class="textarea-field" id="q-prompt" placeholder="What is 2 + 2?" maxlength="500"></textarea>

            <label for="q-category">Category</label>
            <select class="input-field" id="q-category"></select>

            <label for="q-type">Answer type</label>
            <select class="input-field" id="q-type">
              <option value="free">Free type</option>
              <option value="single">Single choice</option>
              <option value="multiple">Multiple choice</option>
            </select>

            <div id="q-free-area">
              <label for="q-free-answers">Accepted answers (one per line, case-insensitive)</label>
              <textarea class="textarea-field" id="q-free-answers" placeholder="4&#10;four"></textarea>
            </div>

            <div id="q-choice-area" style="display:none">
              <label>Options (mark the correct one)</label>
              <div id="q-options"></div>
              <button type="button" class="btn btn-secondary btn-small" id="q-add-option" style="margin-top:0.4rem">+ Add option</button>
            </div>

            <div id="q-form-msg" class="msg"></div>
            <div class="q-form-buttons">
              <button type="button" class="btn btn-secondary btn-small" id="q-cancel-btn" style="display:none">Cancel</button>
              <button type="button" class="btn btn-primary btn-small" id="q-save-btn">Add Question</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Register New User</h2>
        <form id="register-form" class="form-grid">
          <input class="input-field" name="displayName" placeholder="Display name" required autocomplete="off">
          <input class="input-field" name="email" type="email" placeholder="Email" required autocomplete="off">
          <input class="input-field" name="password" type="text" placeholder="Password (min 6 chars)" required autocomplete="new-password">
          <label class="checkbox-row full">
            <input type="checkbox" name="isAdmin"> Make this user an admin
          </label>
          <button type="submit" class="btn btn-primary full">Create User</button>
        </form>
        <div id="register-msg" class="msg"></div>
      </div>

      <div class="panel">
        <h2>Users</h2>
        <ul class="user-list" id="user-list"></ul>
        <div id="users-msg" class="msg"></div>
      </div>

      <div class="panel" id="quizzes-panel">
        <h2>Quizzes</h2>
        <ul class="user-list" id="quiz-list"></ul>
        <div class="quiz-create-row">
          <input class="input-field" id="new-quiz-name" placeholder="New quiz name" maxlength="80">
          <button type="button" class="btn btn-primary btn-small" id="new-quiz-btn">Create Quiz</button>
        </div>
        <div id="quizzes-msg" class="msg"></div>
      </div>

      <div class="panel">
        <h2>Active Games</h2>
        <ul class="user-list" id="active-room-list"></ul>
        <div class="user-actions" style="margin-top:0.5rem">
          <button type="button" class="btn btn-secondary btn-small" id="refresh-active-rooms-btn">Refresh</button>
        </div>
        <div id="active-rooms-msg" class="msg"></div>
      </div>

      <div class="panel">
        <h2>Games</h2>
        <ul class="user-list" id="game-list"></ul>
        <div id="games-msg" class="msg"></div>
      </div>
    </div>

    <div id="denied" class="access-denied" style="display:none">
      <h1 style="margin-bottom:0.5rem">Access denied</h1>
      <p>You need to be an admin to view this page.</p>
      <p style="margin-top:1rem"><a href="/">Back to home</a></p>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
