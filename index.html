<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e94560">
  <title>Triangle Games</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="stylesheet" href="/shared/reset.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      display: inline-block;
      width: 48px;
      height: 48px;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #e94560;
    }

    .tagline {
      font-size: 0.95rem;
      color: #888;
      margin-top: 0.25rem;
    }

    .game-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      max-width: 480px;
      list-style: none;
      padding: 0;
    }

    .game-grid > li {
      flex: 1 1 100%;
      min-width: 0;
    }

    @media (min-width: 600px) {
      .game-grid {
        max-width: 720px;
      }
      .game-grid > li {
        flex: 0 1 calc(50% - 0.5rem);
        min-width: 280px;
      }
    }

    .game-card {
      display: block;
      background: #16213e;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .game-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(233, 69, 96, 0.15);
      }
    }

    .card-preview {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #0f3460;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-preview canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .card-body {
      padding: 1rem 1.25rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #e94560;
      margin-bottom: 0.25rem;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #aaa;
      line-height: 1.4;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
    }

    .admin-link {
      display: none;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #aaa;
      text-decoration: none;
      border: 1px solid #2a3050;
      padding: 0.45rem 0.95rem;
      border-radius: 8px;
    }
    .admin-link.show { display: inline-block; }
    .admin-link:hover { color: #e94560; border-color: #e94560; }
  </style>
</head>
<body>
  <div class="header">
    <!-- Inline SVG triangle logo -->
    <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 6L44 42H4L24 6Z" fill="#e94560" opacity="0.9"/>
      <path d="M24 16L34 36H14L24 16Z" fill="#1a1a2e" opacity="0.6"/>
    </svg>
    <h1>Triangle Games</h1>
    <p class="tagline">Simple games, right in your browser</p>
  </div>

  <ul class="game-grid">
    <li>
      <a href="/games/quiz-battle/" class="game-card">
        <div class="card-preview" id="preview-quiz-battle"></div>
        <div class="card-body">
          <div class="card-title">Quiz Battle</div>
          <div class="card-desc">Build a custom quiz, then challenge friends to real-time rounds. First correct answer wins.</div>
        </div>
      </a>
    </li>
  </ul>

  <a href="/admin/" class="admin-link" id="admin-link">Admin Console</a>

  <div class="footer">
    Triangle Games &mdash; mobile-first fun
  </div>

  <script>
    // Quiz Battle preview: floating question marks
    (function() {
      const el = document.getElementById('preview-quiz-battle');
      if (!el) return;

      const canvas = document.createElement('canvas');
      el.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = el.clientWidth * dpr;
        canvas.height = el.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      const items = [];
      for (let i = 0; i < 10; i++) {
        items.push({
          x: Math.random() * el.clientWidth,
          y: Math.random() * el.clientHeight,
          char: '?',
          size: 16 + Math.random() * 22,
          vy: -(0.2 + Math.random() * 0.4),
          wobble: Math.random() * Math.PI * 2,
          alpha: 0.3 + Math.random() * 0.5,
          color: ['#e94560', '#2ecc71', '#ffd700', '#eee'][Math.floor(Math.random() * 4)],
        });
      }

      function draw() {
        const w = el.clientWidth, h = el.clientHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#1a0a2e';
        ctx.fillRect(0, 0, w, h);

        for (const it of items) {
          it.y += it.vy;
          it.wobble += 0.015;
          it.x += Math.sin(it.wobble) * 0.3;
          if (it.y < -it.size) { it.y = h + it.size; it.x = Math.random() * w; }

          ctx.save();
          ctx.globalAlpha = it.alpha;
          ctx.fillStyle = it.color;
          ctx.font = `bold ${it.size}px system-ui`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(it.char, it.x, it.y);
          ctx.restore();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // Show admin link when the signed-in user is an admin
    fetch('/api/chesnuts/me', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.user && data.user.isAdmin) {
          document.getElementById('admin-link').classList.add('show');
        }
      })
      .catch(() => {});

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

  </script>
</body>
</html>
